# Opus Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opus.fullname" . }}-opus
  labels:
    {{- include "opus.labels" . | nindent 4 }}
    app.kubernetes.io/component: opus
spec:
  type: {{ .Values.opus.service.type }}
  ports:
    - port: {{ .Values.opus.service.port }}
      targetPort: opus
      protocol: TCP
      name: http
  selector:
    {{- include "opus.selectorLabels" . | nindent 4 }}

{{- if .Values.postgresql.enabled }}
---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opus.fullname" . }}-postgresql
  labels:
    {{- include "opus.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: {{ .Values.postgresql.service.type }}
  ports:
    - port: {{ .Values.postgresql.service.port }}
      targetPort: postgresql
      protocol: TCP
      name: postgresql
  selector:
    {{- include "opus.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
{{- end }}
