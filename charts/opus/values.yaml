# Global values
nameOverride: ""
fullnameOverride: ""
replicaCount: 1
# Autoscaling configuration
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80
# Pod configuration
podAnnotations: {}
podSecurityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
# Service account configuration
serviceAccount:
  create: true
  annotations: {}
  name: ""
# PostgreSQL database configuration
postgresql:
  # Set to true to deploy PostgreSQL as part of this chart
  enabled: true
  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  # Database configuration
  auth:
    database: opus
    username: opus_user
    password: opus_password
    # Use existing secret for database credentials (optional)
    existingSecret: ""
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
  # Persistence for PostgreSQL data
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  # PostgreSQL service configuration
  service:
    type: ClusterIP
    port: 5432
  # Resources for PostgreSQL
  resources: {}
  # resources:
  #   limits:
  #     cpu: 500m
  #     memory: 512Mi
  #   requests:
  #     cpu: 100m
  #     memory: 128Mi
# Opus application configuration (combined API + web frontend)
opus:
  image:
    repository: ghcr.io/facilestudio/opus
    tag: latest
    pullPolicy: IfNotPresent
  securityContext: {}
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  # Resources are optional and disabled by default
  resources: {}
  # resources:
  #   limits:
  #     cpu: 500m
  #     memory: 512Mi
  #   requests:
  #     cpu: 100m
  #     memory: 128Mi

  persistence:
    enabled: false
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce

  env:
    # Public URL of this Opus instance (e.g. https://opus.example.com)
    # OPUS_API_URL is derived automatically as clientUrl/api if not set
    clientUrl: ""
    # Allowed CORS origins. Accepts a comma-separated string or YAML list.
    # Defaults to clientUrl when left empty.
    corsOrigins: []
    # Database configuration
    database:
      # Use external PostgreSQL (set postgresql.enabled to false)
      # Important: when using external postgres, make sure you have set up the db user correctly:
      #   CREATE DATABASE opus;
      #   CREATE USER opus_user WITH PASSWORD 'your_password';
      #   GRANT ALL PRIVILEGES ON DATABASE opus TO opus_user;
      #   \c opus;
      #   GRANT USAGE ON SCHEMA public TO opus_user;
      #   GRANT CREATE ON SCHEMA public TO opus_user;
      #   ALTER SCHEMA public OWNER TO opus_user;
      external:
        enabled: false
        host: ""
        port: 5432
        database: opus
        username: opus_user
        password: ""
        # Use existing secret for external database credentials in the form of a uri, e.g.: "postgresql://user:pass@host:port/db"
        existingSecret:
          enabled: false
          name: ""
          passwordKey: postgres_uri
  # Additional environment variables for the opus container.
  # Each entry is a standard Kubernetes EnvVar (supports `value` or `valueFrom`).
  # Sign-in needs the OIDC_* variables: without OIDC_ISSUER nobody can sign in.
  # See docs/configuration.md for every variable the app reads.
  # extraEnv entries are appended after chart-defined vars; duplicate names override.
  extraEnv: []
  # extraEnv:
  #   - name: OIDC_ISSUER
  #     value: "https://sso.example.com"
  #   - name: OIDC_CLIENT_ID
  #     value: "opus"
  #   - name: OIDC_REDIRECT_URL
  #     value: "https://opus.example.com/api/auth/oidc/callback"
  #   - name: OIDC_CLIENT_SECRET
  #     valueFrom:
  #       secretKeyRef:
  #         name: opus-oidc
  #         key: client-secret
  livenessProbe:
    httpGet:
      path: /api/health
      port: opus
    initialDelaySeconds: 60
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /api/health
      port: opus
    initialDelaySeconds: 30
    periodSeconds: 10
# Ingress configuration
ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: opus.local
      paths:
        - path: /
          pathType: Prefix
          service: opus
          port: 80
  tls: []

# Gateway API configuration
gateway:
  enabled: false
  annotations: {}
  labels: {}
  parentRefs: []
  hostnames: []
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - service: opus
          port: 80
