<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Opus · Project management that stays fast</title>
		<meta name="description" content="Boards, linked tasks and instant search for the whole team." />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Facile" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:url" content="https://opus.facile.studio/" />
		<meta property="og:title" content="Opus · Project management that stays fast" />
		<meta property="og:description" content="Boards, linked tasks and instant search for the whole team." />
		<meta property="og:image" content="https://opus.facile.studio/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Opus: Project management that stays fast" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Opus · Project management that stays fast" />
		<meta name="twitter:description" content="Boards, linked tasks and instant search for the whole team." />
		<meta name="twitter:image" content="https://opus.facile.studio/og-image.png" />
		<meta name="color-scheme" content="light dark" />
		<link rel="canonical" href="https://opus.facile.studio/" />
		<script>
			(() => {
				try {
					var stored = JSON.parse(localStorage.getItem('user-preferences') || '{}').state;
					var theme = stored && stored.theme;
					var dark =
						theme === 'dark' || ((!theme || theme === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.classList.toggle('dark', dark);
					document.documentElement.classList.toggle('light', !dark);
				} catch (e) {}
			})();
		</script>
		<script>
			(() => {
				if (location.hostname !== 'opus.facile.studio' || location.pathname.indexOf('/shared/') === 0) return;
				var s = document.createElement('script');
				s.async = true;
				s.src = 'https://vision.facile.studio/s.js';
				s.setAttribute('data-mask', '');
				document.head.appendChild(s);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
