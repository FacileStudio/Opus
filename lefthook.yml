remotes:
  - git_url: https://github.com/FacileStudio/hooks
    ref: v1
    refetch_frequency: 24h
    configs:
      - common.yml

pre-commit:
  commands:
    biome:
      run: pnpm exec biome ci .
    build:
      run: pnpm run build

pre-push:
  jobs:
    - name: gate
      run: filet gate .
    - name: douane
      run: douane scan -fail critical -scope prod apps/api
