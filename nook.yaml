# Documents the pool events Opus syncs with Sablier. The Go API builds its pool config
# in apps/api/internal/events (AllChannels emit, SyncChannels listen) — keep this file in sync with it.
app: Opus
events:
  emit:
    - project.created
    - project.updated
    - project.deleted
    - task.created
    - task.updated
    - task.deleted
  listen:
    - project.created
    - project.updated
    - project.deleted
    - task.created
    - task.updated
    - task.deleted
