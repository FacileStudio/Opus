name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    env:
      TEST_DATABASE_URL: postgres://opus:opus@127.0.0.1:5432/postgres?sslmode=disable

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: postgres
        run: |
          docker run -d --name postgres -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=opus -e POSTGRES_PASSWORD=opus -e POSTGRES_DB=postgres \
            postgres:16 -c fsync=off -c synchronous_commit=off -c full_page_writes=off
          for _ in $(seq 60); do docker exec postgres pg_isready -h 127.0.0.1 -U opus -d postgres -q && exit 0; sleep 1; done
          exit 1

      - name: postgres only
        run: "! grep -E 'gorm.io/driver/(sqlite|mysql|sqlserver|clickhouse)|mattn/go-sqlite3' go.mod"

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build -o /dev/null .

      - name: tests
        run: go test -race -count=1 ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: i18n
        run: pnpm i18n:check

      - name: typecheck
        run: pnpm --filter @opus/web typecheck

      - name: lint
        run: pnpm --filter @opus/web exec biome check .

      - name: tests
        run: pnpm --filter @opus/web test

      - name: build
        run: pnpm --filter @opus/web build
        env:
          NODE_ENV: production

      - name: site check
        run: pnpm --filter @opus/site check

      - name: site build
        run: pnpm --filter @opus/site build

  filet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: FacileStudio/filet@v0.19.2
        with:
          version: v0.19.2
          fail-on: error
          antenne-url: ${{ secrets.ANTENNE_FILET_SECRET != '' && 'https://antenne.facile.studio/webhook/filet' || '' }}
          antenne-secret: ${{ secrets.ANTENNE_FILET_SECRET }}

  douane:
    runs-on: ubuntu-latest
    env:
      DOUANE_VERSION: 0.7.2
      DOUANE_SHA256: 2a8875196d61111d01004fd2e7bf52fb92ebac9dc62015694c52f0251591d7a1
    steps:
      - uses: actions/checkout@v7

      - name: install douane
        working-directory: ${{ runner.temp }}
        run: |
          set -eu
          archive="douane_${DOUANE_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/FacileStudio/douane/releases/download/v${DOUANE_VERSION}/$archive"
          echo "${DOUANE_SHA256}  $archive" | sha256sum -c -
          tar xzf "$archive" douane
          ./douane --version

      - name: scan
        run: |
          "$RUNNER_TEMP/douane" scan -fail critical -scope prod apps/api
