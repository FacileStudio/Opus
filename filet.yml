# The Facile Go coding standard, enforced by filet.
# https://github.com/FacileStudio/filet
#
#   filet check .     the rules
#   filet gate .      format, rules, analyzers, tests and douane: the pre-push step
#
# Opus is a mixed repo: the Go backend (apps/api) is filet's, the React
# frontend (apps/web) is biome's. That split is why the extension list is
# Go-only and apps/web is ignored. A preset's lists are replaced, not merged,
# so the ignore list is restated in full.
#
# The limits are looser than the preset's: the API was ported from an older
# codebase, and the ported modules were written to these numbers. Tightening
# them is its own change.

preset: facile

kind: app

ignore:
  - node_modules
  - vendor
  - build
  - dist
  - testdata
  - coverage
  - apps/web

extensions: [.go]

limits:
  fileLines: 300
  funcsPerFile: 0
  funcLines: 60
  funcStatements: 40
  nesting: 5
  complexity: 15
  structFields: 15
  interfaceMethods: 5

architecture:
  requiredDirs: [apps/api]

# douane cannot read pnpm-lock.yaml, so a scan of the repository root always
# ends "scan incomplete" (exit 3). The pre-push hook and CI run douane on
# apps/api instead, the module that ships.
gate:
  disable: [douane]
