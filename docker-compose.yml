services:
  postgres:
    container_name: opus-db
    image: postgres:16-alpine
    env_file:
      - .env
    volumes:
      - opus-db-data:/var/lib/postgresql/data
      - ./deploy/db/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opus -d opus"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

  opus:
    container_name: opus-app
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/facilestudio/opus:latest
    env_file:
      - .env
    volumes:
      - opus-uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/opus-api", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s

#  Optional for HA Setup
#  redis:
#    container_name: opus-redis
#    image: valkey/valkey
#    ports:
#      - "6379:6379"

volumes:
  opus-db-data:
    name: opus-db-data
  opus-uploads:
    name: opus-uploads
