services:
  postgres:
    container_name: opus-db
    image: postgres:16-alpine
    env_file:
    - .env
    volumes:
    - opus-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '3000'
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
  opus:
    container_name: opus-app
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/facilestudio/opus:latest
    env_file:
    - .env
    volumes:
    - opus-uploads:/app/apps/api/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '3000'
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
volumes:
  opus-db-data:
    name: opus-db-data
  opus-uploads:
    name: opus-uploads
